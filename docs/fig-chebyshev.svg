<text x="644.4" y="314.0" text-anchor="middle" font-size="10" fill="#555">F</text><text x="360.0" y="388" text-anchor="middle" font-size="11.5" fill="#444">Red* = quadratic-residue class (octal 1; hex 1 &amp; 9). It runs light. Octal-1 = hex-1 + hex-9, so the deficit refines exactly.</text></svg>